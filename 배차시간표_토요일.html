<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<title>버스 배차 관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html { background-color: #e2e8f0; height: 100%; display: flex; justify-content: center; }
body { font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#f5f5f5; font-size:12px; -webkit-text-size-adjust:none; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; font-variant-numeric:tabular-nums; display:flex; flex-direction:column; height: 100%; width: 100%; max-width: 1000px; box-shadow: 0 0 20px rgba(0,0,0,0.15); overflow: hidden; margin: 0 auto; }

.topbar { background:#fff; border-bottom:1px solid #ddd; padding:8px 12px; display:flex; align-items:center; justify-content:space-between; z-index:20; box-shadow:0 1px 3px rgba(0,0,0,.08); flex-shrink:0; }
.topbar h1 { font-size:14px; font-weight:bold; color: #2563eb; }
.tabs { display:flex; gap:4px }
.tab { padding:7px 10px; border-radius:8px; font-size:12px; font-weight:bold; border:none; cursor:pointer; background:#f0f0f0; color:#555; transition: 0.2s; }
.tab.active { background:#2563eb; color:#fff }
.tab.print-btn { background:#10b981; color:#fff; } 
.tab.share-btn { background:#8b5cf6; color:#fff; }

.quick-nav { display: flex; background: #fff; padding: 6px 12px; gap: 6px; border-bottom: 1px solid #e2e8f0; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; flex-shrink: 0; align-items: center; }
.quick-nav::-webkit-scrollbar { height: 0px; background: transparent; }
.nav-btn { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; text-decoration: none; color: #4a5568; background: #edf2f7; border: 1px solid #cbd5e0; cursor: pointer; flex-shrink:0; -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
.nav-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
.crew-row { display:flex; gap:5px; align-items:center; margin-bottom:6px; }
.crew-row select, .crew-row input { padding:6px 4px; border:1px solid #cbd5e0; border-radius:6px; font-size:12px; background:#fff; }
.crew-row .cr-del { width:28px; padding:6px 0; border:1px solid #fed7d7; background:#fff5f5; color:#e53e3e; border-radius:6px; font-size:12px; cursor:pointer; }
.crew-swatch { width:22px; height:22px; border-radius:5px; border:1px solid #cbd5e0; cursor:pointer; flex-shrink:0; }
.nav-btn.slot-add { background:#ebf8ff; color:#2b6cb0; border-color:#bee3f8; font-weight:800; }
.nav-btn.slot-edit { background:#f8fafc; color:#64748b; border-color:#e2e8f0; padding:6px 9px; }
.nav-btn.home { background: #4a5568; color: #fff; border-color: #4a5568; }

.infobar { padding:4px 12px; background:#eff6ff; font-size:10px; color:#1d4ed8; display:flex; gap:12px; flex-shrink:0; border-bottom: 1px solid #bfdbfe; }
.infobar b { font-weight:bold }
.content { flex:1; overflow-y:auto; overflow-x:hidden; background:#f5f5f5; padding-bottom: 40px; }

table { border-collapse:collapse; width:100%; table-layout:fixed; background:#fff; border-bottom: 1px solid #9ca3af !important; border-top: 1px solid #9ca3af !important; }
th { background:#dbeafe !important; border:1px solid #cbd5e1; padding:4px 2px; font-size:11px; text-align:center; position:sticky; top:0; z-index:10; border-bottom: 1px solid #9ca3af !important; }
th.fix-col { left: 0; z-index: 12; border-right: 1px solid #9ca3af !important; }
td.seq { font-weight:600; background:#f8fafc !important; width:28px; position: sticky; left: 0; z-index: 5; border-right: 1px solid #9ca3af !important; }
td { border:1px solid #cbd5e1; text-align:center; padding:1px; font-size:11px }

/* 화면 폭에 따라 표 글자 크기 자동 조절 (JS 가 --col-w 를 갱신) */
:root { --fs-time: 12.5px; --fs-sub2: 9.5px; }
td.rest-bad { background:#fee2e2; color:#b91c1c }

td.dep { font-size: var(--fs-time); font-weight: 600; color: #1d4ed8; padding: 2px 0; }
td.arr { font-size: var(--fs-time); font-weight: 600; color: #0f766e; padding: 2px 0; }
td.dep-s { color:#dc2626; font-weight:700; }
td.tt, td.hj { font-size: var(--fs-sub2); font-weight: 500; letter-spacing: -0.3px; color: #334155; white-space: nowrap; overflow: hidden; padding: 2px 0; line-height: 1.2; }

table tbody tr.bus-start td { border-top: 1px solid #9ca3af !important; }

/* 🚨 계단현상 방지: 소수점(1.5px)을 없애고 딱 떨어지는 2px 정수 사용! 🚨 */
table td.div-left { border-left: 2px solid #ef4444 !important; }
table tbody tr.bus-start td.div-top { border-top: 2px solid #ef4444 !important; }

.input-table input { width:100%; text-align:center; border:none; background:transparent; outline:none; font-size:12px; font-weight:600; padding:6px 2px; color:#1d4ed8 }
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; display:flex; align-items:center; justify-content:center; padding:16px }
.modal { background:#fff; border-radius:16px; padding:24px; width:100%; max-width:340px; text-align:center; }
.modal-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; text-align:left; }
.modal-row input { width:64px; height:40px; border:2px solid #93c5fd; border-radius:8px; text-align:center; font-size:16px; font-weight:bold; }
.hidden { display:none }

#print-container { display: none; }
@media print {
    html, body { height: 100% !important; overflow: visible !important; margin: 0 !important; padding: 0 !important; background: #fff !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    body.use-custom-print > *:not(#print-container) { display: none !important; }
    body.use-custom-print #print-container { display: block !important; width: 100%; background: #fff; }
    @page { size: A4 portrait; margin: 0; }
    .custom-print-page { width: 100%; height: 296mm; padding: 12mm 10mm 10mm 10mm; box-sizing: border-box; page-break-after: always; break-after: page; background: #ffffff; display: flex; flex-direction: column; overflow: hidden; }
    .custom-print-page:last-child { page-break-after: auto; break-after: auto; }

    /* ── 선 그리기 규칙 (겹침 방지: 각 경계는 한 셀만 그림) ──
       모든 셀은 '위'와 '왼쪽'만 그린다. 아래/오른쪽은 이웃 셀이 담당.
       box-shadow 는 쓰지 않는다 (border 와 이중으로 보이는 원인). */
    .x-table, .x-table th, .x-table td { box-shadow: none !important; }

    .x-table td, .x-table th {
        border: 0 !important;
        border-top: 0.4px solid #c2cad4 !important;
        border-left: 0.4px solid #c2cad4 !important; }

    /* 표 바깥 테두리 */
    .x-table { border: 1px solid #9ca3af !important; }
    .x-table tr > td:last-child, .x-table tr > th:last-child { border-right: 0 !important; }

    /* 헤더 아래 = 첫 데이터행 위선으로 처리 (이중 방지) */
    .x-table thead th { border-top: 0 !important; }

    /* 차량 구분 가로선 (진하게) */
    .x-table tr.x-bus-start > td { border-top: 1px solid #9ca3af !important; }
    /* 순번 열 오른쪽 경계 — 순번 셀 자신이 오른쪽 선을 그린다 (위치 오인 방지) */
    .x-table td.x-seq, .x-table th.x-th-seq {
        border-right: 1px solid #9ca3af !important; }

    /* 빨간 AM/PM 구분선 (마지막 선언 → 항상 우선) */
    .x-table td.x-div-left,
    .x-table th.x-div-left { border-left: 2px solid #ef4444 !important; }
    .x-table tr.x-bus-start > td.x-div-top { border-top: 2px solid #ef4444 !important; }
}
</style>
</head>
<body>

<div class="topbar">
  <h1 id="appTitle">배차 관리</h1><span id="appVer" style="font-size:10px;color:#94a3b8;margin-left:6px;">v0903-0325</span>
  <div class="tabs">
    <button class="tab active" onclick="switchView('integrated')">통합</button>
    <button class="tab" onclick="switchView('split')">분리</button>
    <button class="tab" onclick="switchView('input')">입력</button>
    <button class="tab share-btn" onclick="openShareModal()">📷 전송</button>
    <button class="tab print-btn" onclick="triggerPrint()">🖨️</button> <button class="tab" onclick="openSettings()">⚙️</button>
  </div>
</div>

<div class="quick-nav" id="slotNav">
  <button onclick="location.replace('index.html')" class="nav-btn home">🏠 홈</button>
</div>

<div class="infobar" id="infobar"></div>
<div class="content" id="content"></div>
<div id="print-container"></div>

<div class="modal-bg hidden" id="modal-bg" onclick="closeSettings()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 style="text-align:left;">⚙️ 배차 설정 및 백업</h3><br>
    <div class="modal-row"><label>운행대수</label><div><input id="s-bc" type="number">대</div></div>
    <div class="modal-row"><label>회차지비율</label><input id="s-rt" type="text" style="width:80px"></div>
    <div class="modal-row"><label>오후시작</label><div><input id="s-pt" type="number" style="width:45px">회<input id="s-pb" type="number" style="width:45px">번</div></div>
    <div class="modal-row"><label style="color:#2563eb;">총운행횟수</label><div><input id="s-mt" type="number" style="width:45px">회</div></div>
    
    <div style="border-top:1px solid #eee; margin:15px 0; padding-top:12px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <label style="font-size:13px; font-weight:bold; color:#334155;">🎨 조 구분 색상</label>
            <button onclick="addCrewRow()" style="font-size:11px; font-weight:700; color:#2b6cb0; background:#ebf8ff; border:1px solid #bee3f8; border-radius:6px; padding:4px 9px;">+ 추가</button>
        </div>
        <div id="crewList"></div>
        <p style="font-size:10px; color:#94a3b8; margin:6px 0 0; text-align:left;">지정한 차량의 오전/오후 영역 전체에 바탕색이 표시됩니다.</p>
    </div>

    <div style="border-top:1px solid #eee; margin:15px 0; padding-top:15px;">
        <p style="font-size:11px; color:#666; margin-bottom:10px; text-align:left;">⚠️ 업데이트 전 데이터를 백업하세요.</p>
        <div style="display:flex; gap:8px;">
            <button style="flex:1; padding:8px; font-size:11px; border-radius:6px; border:1px solid #2563eb; background:white; color:#2563eb;" onclick="exportData()">💾 데이터 백업</button>
            <button style="flex:1; padding:8px; font-size:11px; border-radius:6px; border:1px solid #10b981; background:white; color:#10b981;" onclick="document.getElementById('importFile').click()">📂 데이터 복구</button>
            <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(this)">
        </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:10px;">
        <button style="flex:1; padding:12px; border-radius:8px; border:none; background:#eee;" onclick="closeSettings()">취소</button>
        <button style="flex:1; padding:12px; border-radius:8px; border:none; background:#2563eb; color:white; font-weight:bold;" onclick="applySettings()">적용하기</button>
    </div>
  </div>
</div>

<div class="modal-bg hidden" id="share-modal-bg" onclick="closeShareModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 style="margin-bottom:20px">📷 시간표 사진 전송</h3>
    <label style="display:flex; align-items:center; justify-content:center; gap:8px; margin:-8px 0 16px 0; font-size:14px; color:#475569; cursor:pointer;">
      <input type="checkbox" id="exportRestChk" style="width:18px; height:18px; accent-color:#475569;" onchange="saveExportRestOption()">
      휴식시간 포함
    </label>
    <button style="width:100%; padding:14px; margin-bottom:10px; border-radius:8px; background:#2563eb; color:#fff; border:none; font-weight:bold;" onclick="captureAndShare('integrated')">통합 시간표 전송</button>
    <button style="width:100%; padding:14px; margin-bottom:10px; border-radius:8px; background:#1e40af; color:#fff; border:none; font-weight:bold;" onclick="captureAndShare('am')">오전 시간표 전송</button>
    <button style="width:100%; padding:14px; margin-bottom:10px; border-radius:8px; background:#991b1b; color:#fff; border:none; font-weight:bold;" onclick="captureAndShare('pm')">오후 시간표 전송</button>
    <button style="width:100%; padding:14px; margin-bottom:10px; border-radius:8px; background:#0f766e; color:#fff; border:none; font-weight:bold;" onclick="captureAndShare('split')">오전+오후 나란히 전송</button>
    <button style="width:100%; padding:14px; border-radius:8px; background:#e2e8f0; color:#4a5568; border:none;" onclick="closeShareModal()">닫기</button>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }

// ── 내보내기 휴식시간 포함 옵션 ──
function getExportRestOption(){
  try { return localStorage.getItem('exportWithRest') === '1'; } catch(e){ return false; }
}
function saveExportRestOption(){
  var el = document.getElementById('exportRestChk');
  try { localStorage.setItem('exportWithRest', el && el.checked ? '1' : '0'); } catch(e){}
}
function restoreExportRestOption(){
  var el = document.getElementById('exportRestChk');
  if(el) el.checked = getExportRestOption();
}
window.addEventListener('load', function(){ setTimeout(restoreExportRestOption, 60); });


const fileName = window.location.pathname.split('/').pop() || 'default_101';
let displayTitle = decodeURIComponent(fileName).replace('.html', '').replace('배차시간표_', '');

const busNum = localStorage.getItem('busNumber') || '101';
document.getElementById('appTitle').innerText = `${busNum}번 ${displayTitle}`;

// URL 의 ?id=N 으로 같은 종류의 시간표를 여러 개 구분해서 저장
const slotId = new URLSearchParams(location.search).get('id') || '';
const slotSuffix = slotId ? ('#' + slotId) : '';

let STORAGE_KEY = 'bus101Data_v2_' + decodeURIComponent(fileName) + slotSuffix;
if (busNum !== '101') {
    STORAGE_KEY = 'busData_v2_' + busNum + '_' + decodeURIComponent(fileName) + slotSuffix;
}

// ── 같은 종류 시간표 여러 개 관리 (슬롯) ──
const KIND_KEY = displayTitle;                    // 평일 / 토요일 / ...
const SELF_FILE = decodeURIComponent(fileName);

function slotsStoreKey() { return 'slots_v1_' + busNum + '_' + KIND_KEY; }

function loadSlotList() {
    try {
        const raw = localStorage.getItem(slotsStoreKey());
        if (raw) {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr) && arr.length) return arr;
        }
    } catch(e) {}
    return [{ id: '', name: KIND_KEY }];
}
function saveSlotList(arr) {
    try { localStorage.setItem(slotsStoreKey(), JSON.stringify(arr)); } catch(e) {}
}
function goSlot(id) {
    const url = id ? (SELF_FILE + '?id=' + encodeURIComponent(id)) : SELF_FILE;
    location.replace(url);
}
function renderSlotNav() {
    const nav = document.getElementById('slotNav');
    if (!nav) return;
    nav.querySelectorAll('.slot-item').forEach(function(el){ el.remove(); });

    const list = loadSlotList();
    list.forEach(function(slot, idx) {
        const b = document.createElement('button');
        b.className = 'nav-btn slot-item slot-btn-item' + (slot.id === slotId ? ' active' : '');
        b.innerText = slot.name || KIND_KEY;
        b.dataset.idx = idx;
        b.onclick = function(){
            if (b.dataset.dragging === '1') return;   // 드래그 직후 클릭 방지
            if (slot.id !== slotId) goSlot(slot.id);
        };
        attachSlotDrag(b, idx);
        nav.appendChild(b);
    });

    const edit = document.createElement('button');
    edit.className = 'nav-btn slot-edit slot-item';
    edit.innerText = '\u270F\uFE0F';
    edit.title = '현재 시간표 이름 변경';
    edit.onclick = renameCurrentSlot;
    nav.appendChild(edit);

    const add = document.createElement('button');
    add.className = 'nav-btn slot-add slot-item';
    add.innerText = '+ 추가';
    add.onclick = addNewSlot;
    nav.appendChild(add);

    // 삭제 버튼 — 어느 슬롯이든 삭제 가능
    const del = document.createElement('button');
    del.className = 'nav-btn slot-item';
    del.style.cssText = 'background:#fff5f5;color:#e53e3e;border-color:#fed7d7;';
    del.innerText = '\u274C';
    del.title = '현재 시간표 삭제';
    del.onclick = deleteCurrentSlot;
    nav.appendChild(del);
}

// ── 길게 눌러 순서 변경 ──
let _dragIdx = null, _dragTimer = null, _dragEl = null;

function attachSlotDrag(el, idx) {
    function start(clientX) {
        _dragTimer = setTimeout(function() {
            _dragIdx = idx; _dragEl = el;
            el.dataset.dragging = '1';
            el.style.opacity = '0.55';
            el.style.transform = 'scale(1.06)';
            try {
                const sel = window.getSelection();
                if (sel && sel.removeAllRanges) sel.removeAllRanges();
            } catch(e) {}
            const nav = document.getElementById('slotNav');
            if (nav) nav.style.overflowX = 'hidden';
            if (navigator.vibrate) { try { navigator.vibrate(30); } catch(e){} }
        }, 450);
    }
    function cancelTimer() { if (_dragTimer) { clearTimeout(_dragTimer); _dragTimer = null; } }

    el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    el.addEventListener('touchstart', function(e){ start(e.touches[0].clientX); }, {passive:true});
    el.addEventListener('mousedown', function(e){ e.preventDefault(); start(e.clientX); });

    el.addEventListener('touchmove', function(e){
        if (_dragIdx === null) { cancelTimer(); return; }
        e.preventDefault();
        handleDragOver(e.touches[0].clientX);
    }, {passive:false});

    el.addEventListener('touchend', function(){ cancelTimer(); endDrag(); }, {passive:true});
    el.addEventListener('touchcancel', function(){ cancelTimer(); endDrag(); }, {passive:true});
    el.addEventListener('mouseup', function(){ cancelTimer(); endDrag(); });
    el.addEventListener('mouseleave', function(){ cancelTimer(); });
}

function handleDragOver(clientX) {
    const items = Array.from(document.querySelectorAll('#slotNav .slot-btn-item'));
    for (let i = 0; i < items.length; i++) {
        const r = items[i].getBoundingClientRect();
        if (clientX >= r.left && clientX <= r.right) {
            const targetIdx = Number(items[i].dataset.idx);
            if (targetIdx !== _dragIdx) {
                const list = loadSlotList();
                const moved = list.splice(_dragIdx, 1)[0];
                list.splice(targetIdx, 0, moved);
                saveSlotList(list);
                _dragIdx = targetIdx;
                renderSlotNav();
                // 새로 그려진 요소에 드래그 상태 유지
                const again = document.querySelector('#slotNav .slot-btn-item[data-idx="' + targetIdx + '"]');
                if (again) {
                    _dragEl = again;
                    again.dataset.dragging = '1';
                    again.style.opacity = '0.55';
                    again.style.transform = 'scale(1.06)';
                }
            }
            break;
        }
    }
}

function endDrag() {
    if (_dragEl) {
        _dragEl.style.opacity = '';
        _dragEl.style.transform = '';
        const el = _dragEl;
        setTimeout(function(){ if (el) el.dataset.dragging = '0'; }, 60);
    }
    const nav = document.getElementById('slotNav');
    if (nav) nav.style.overflowX = 'auto';
    _dragIdx = null; _dragEl = null;
}
function addNewSlot() {
    const list = loadSlotList();
    const name = prompt('새 ' + KIND_KEY + ' 시간표 이름을 입력하세요.', KIND_KEY + ' 추가');
    if (name === null) return;
    const t = name.trim();
    if (!t) { alert('이름을 입력해 주세요.'); return; }
    const newId = 's' + Date.now().toString(36);
    list.push({ id: newId, name: t });
    saveSlotList(list);
    goSlot(newId);
}
function renameCurrentSlot() {
    const list = loadSlotList();
    let cur = null;
    list.forEach(function(s){ if (s.id === slotId) cur = s; });
    if (!cur) return;
    const name = prompt('이 시간표의 이름을 입력하세요.', cur.name || KIND_KEY);
    if (name === null) return;
    const t = name.trim();
    if (!t) { alert('이름을 입력해 주세요.'); return; }
    cur.name = t;
    saveSlotList(list);
    document.getElementById('appTitle').innerText = busNum + '번 ' + t;
    renderSlotNav();
}
function deleteCurrentSlot() {
    const list = loadSlotList();
    let cur = null;
    list.forEach(function(s){ if (s.id === slotId) cur = s; });
    if (!cur) return;

    // 마지막 하나만 남았으면 삭제 대신 내용 비우기
    if (list.length <= 1) {
        if (!confirm('[ ' + (cur.name || KIND_KEY) + ' ]\n마지막 시간표라 삭제할 수 없습니다.\n입력한 내용만 모두 지울까요?')) return;
        try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
        location.reload();
        return;
    }

    if (!confirm('[ ' + (cur.name || KIND_KEY) + ' ] 시간표를 삭제할까요?\n입력한 시간 데이터도 함께 지워집니다.')) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}

    const rest = list.filter(function(s){ return s.id !== slotId; });
    saveSlotList(rest);
    goSlot(rest[0].id);   // 남은 첫 시간표로 이동
}

const deps={}, tts={};

function pt(s){if(!s||s==='')return null; const m=String(s).match(/^(\d{1,2}):(\d{2})$/); return m?parseInt(m[1])*60+parseInt(m[2]):null;}
function fmt(m,h24){if(m==null)return''; if(m==='S')return'S'; const hh=Math.floor(m/60),mm=Math.round(m%60); return `${h24?hh:hh%24}:${mm<10?'0'+mm:mm}`;}

function compute(){
  const N=busCount, tot=N*maxTrip, seq=[]; 
  for(let d=1;d<=tot;d++){
    const trip=Math.floor((d-1)/N)+1, bus=((d-1)%N)+1;
    const raw=deps[`${bus}-${trip}`];
    const isS=typeof raw==='string'&&raw.toUpperCase()==='S';
    const isA=raw!=null&&!isS&&pt(raw)!=null;
    const val=isA?pt(raw):null;
    const tt=tts[`${bus}-${trip}`];
    seq.push({d,trip,bus,isS,isA,val,tt:tt!=null?Number(tt):null,act:!isS});
  }
  let cum=0; for(const s of seq){if(s.act)cum++;s.cum=cum;}
  const anc=seq.filter(s=>s.isA);
  for(const s of seq){
    s.pa=null;s.na=null;
    for(let i=anc.length-1;i>=0;i--)if(anc[i].d<=s.d){s.pa=anc[i];break;}
    for(let i=0;i<anc.length;i++)if(anc[i].d>=s.d){s.na=anc[i];break;}
  }
  for(const s of seq){
    if(s.isS){s.ex='S';continue;}if(s.isA){s.ex=s.val;continue;}
    if(!s.act||!s.pa||!s.na){s.ex=null;continue;}
    if(s.pa.cum===s.na.cum){s.ex=s.pa.val;continue;}
    s.ex=s.pa.val+(s.cum-s.pa.cum)/(s.na.cum-s.pa.cum)*(s.na.val-s.pa.val);
  }
  for(const s of seq){
    if(s.trip<=1||s.d<=N){s.rest=null;continue;}
    const p=seq[s.d-1-N];
    if(!p||p.ex==null||p.ex==='S'||p.tt==null||s.ex==null||s.ex==='S'){s.rest=null;continue;}
    s.rest=s.ex-(p.ex+p.tt);
  }
  for(let i=0;i<seq.length;i++){
    const pr=i>0&&seq[i-1].rest!=null?seq[i-1].rest:null;
    const nr=i<seq.length-1&&seq[i+1].rest!=null?seq[i+1].rest:null;
    seq[i].anr=pr!=null&&nr!=null?(pr+nr)/2:pr??nr??null;
  }
  // ii 계산 (휴식 표시 등 다른 로직 호환 위해 유지)
  for(const s of seq){
    if(s.isA||!s.act||!s.pa||!s.na||s.pa.cum===s.na.cum){s.ii=null;}
    else{s.ii=(s.na.val-s.pa.val)/(s.na.cum-s.pa.cum);}
    s.ifr=s.ii!=null?s.ii-Math.floor(s.ii):null;
  }
  // 정점 기반 자투리 배분: anchor 구간 단위로 처리
  // 출근정점 07:00(420분), 퇴근정점 17:00(1020분)
  // 구간의 앞끝/뒤끝 중 정점에 가까운 쪽을 더 촘촘하게 (짧은 간격 몰기)
  const PEAK_AM=360, PEAK_PM=960;
  const distPeak=(t)=>Math.min(Math.abs(t-PEAK_AM),Math.abs(t-PEAK_PM));
  for(const s of seq){
    if(s.isA){s.fd=s.val;continue;}
    if(s.isS){s.fd='S';continue;}
    s.fd=null;
  }
  const ancList=seq.filter(s=>s.isA).sort((a,b)=>a.d-b.d);
  for(let ai=0;ai<ancList.length-1;ai++){
    const a0=ancList[ai], a1=ancList[ai+1];
    const mid=seq.filter(s=>s.d>a0.d&&s.d<a1.d&&s.act&&!s.isS&&!s.isA).sort((a,b)=>a.d-b.d);
    const totalGaps=a1.cum-a0.cum;
    if(totalGaps<=0){ for(const s of mid)s.fd=a0.val; continue; }
    const total=a1.val-a0.val;
    const ii=total/totalGaps;
    const base=Math.floor(ii);
    const frac=ii-base;
    const nLong=Math.round(frac*totalGaps);
    const nShort=totalGaps-nLong;
    // 정점(06:00/16:00)에 가까운 슬롯을 짧은 간격으로.
    // 거리는 정점 기준 V자이므로 "가까운 nShort개"는 연속 구간을 이룸.
    // 엑셀 수식과 동일한 방식(정렬 없이 창 위치 계산)으로 결과 일치 보장.
    const gaps=new Array(totalGaps).fill(base+1);
    if(nShort>0 && nLong>0){
      const clamp=(x,lo,hi)=>Math.max(lo,Math.min(hi,x));
      let best=null;
      [PEAK_AM,PEAK_PM].forEach(function(pk){
        const ks=(pk-a0.val)/ii-0.5;
        const kc=clamp(ks,0,totalGaps-1);
        const d=Math.abs((a0.val+ii*(kc+0.5))-pk);
        if(best===null||d<best.d) best={d:d, ks:ks};
      });
      const lo=clamp(Math.round(best.ks-(nShort-1)/2),0,totalGaps-nShort);
      for(let k=lo;k<lo+nShort;k++) gaps[k]=base;
    } else if(nLong<=0){
      for(let k=0;k<totalGaps;k++) gaps[k]=base;
    }
    for(const s of mid){
      const steps=s.cum-a0.cum;
      let val=a0.val;
      for(let k=0;k<steps;k++)val+=gaps[k];
      s.fd=val;
    }
  }
  for(const s of seq){ if(s.fd!=null&&s.fd!=='S'&&s.tt!=null){s.mp=s.fd+s.tt*ratio;s.ar=s.fd+s.tt;} }
  for(const s of seq){
    if(s.trip<=1||s.d<=N){s.dr=null;continue;}
    const p=seq[s.d-1-N];
    if(!p||p.fd==null||p.fd==='S'||p.tt==null||s.fd==null||s.fd==='S'){s.dr=null;continue;}
    s.dr=Math.round(s.fd-(p.fd+p.tt));
  }
  return seq;
}

function busRows(bus, slots, isIntegrated = false){
    const splitD = (pmTrip - 1) * busCount + pmBus;
    let r1=`<td rowspan="3" class="seq">${bus}</td>`, r2='', r3='';
    
    slots.forEach((s,i)=>{
        const t = i + 1;
        const isPM = ((t - 1) * busCount + bus) >= splitD;
        const isPrevTripAM = t > 1 ? (((t - 2) * busCount + bus) < splitD) : false;
        const isPrevBusAM = bus > 1 ? (((t - 1) * busCount + bus - 1) < splitD) : false;
        
        let clsL = (isIntegrated && isPM && isPrevTripAM) ? ' div-left' : '';
        let clsT = (isIntegrated && isPM && isPrevBusAM) ? ' div-top' : '';

        const isS=s&&s.fd==='S'; 
        // 오전/오후 표는 회차 번호가 재부여되므로 실제 회차(s.trip) 로 판정
        const realTrip = (s && s.trip) ? s.trip : t;
        const hasData = !!(s && (s.fd != null && s.fd !== ''));
        const cwc = (hasData && typeof crewColorOf === 'function') ? crewColorOf(bus, realTrip) : null;
        const bgS = cwc ? ` style="background:${cwc} !important;"` : '';
        r1+=`<td colspan="2" class="dep ${isS?'dep-s':''}${clsL}${clsT}"${bgS}>${s?fmt(s.fd):''}</td>`;
        if(i<slots.length-1){ 
            const ns=slots[i+1]; 
            const drv = ns&&ns.dr!=null?ns.dr:'';
            const restBg = (drv !== '' && cwc) ? bgS : '';
            r1+=`<td rowspan="3" class="rest ${ns&&ns.dr!=null&&ns.dr<30&&!isS?'rest-bad':''}${clsT}"${restBg}>${drv}</td>`; 
        }
        r2+=`<td class="tt${clsL}"${bgS}>${s&&s.tt||''}</td><td class="hj"${bgS}>${s&&s.mp!=null?fmt(s.mp):''}</td>`;
        r3+=`<td colspan="2" class="arr${clsL}"${bgS}>${s&&s.ar!=null?fmt(s.ar,true):''}</td>`;
    });
    return `<tr class="bus-start">${r1}</tr><tr>${r2}</tr><tr>${r3}</tr>`;
}

function thead(trips){
    let h='<tr><th class="fix-col" style="width:28px">순번</th>';
    trips.forEach((t,i)=>{ h+=`<th colspan="2">${t}회</th>`; if(i<trips.length-1) h+=`<th style="width:28px">휴식</th>`; });
    return `<thead>${h}</tr></thead>`;
}

function renderIntegrated(el){
    const trips = Array.from({length: maxTrip}, (_, i) => i + 1);
    const _wInt = 30 + maxTrip*78 + (maxTrip-1)*26;
    let h=`<div style="padding:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;"><table style="min-width:${_wInt}px">${thead(trips)}<tbody>`;
    for(let b=1;b<=busCount;b++) h+=busRows(b, trips.map(t=>gs(b,t)), true);
    el.innerHTML=h+'</tbody></table></div>';
}

function renderSplit(el){
    const splitD=(pmTrip-1)*busCount+pmBus;
    const amTrips = Array.from({length: pmTrip}, (_, i) => i + 1);
    const pmLen = Math.max(1, maxTrip - pmTrip + 1);
    const pmTrips = Array.from({length: pmLen}, (_, i) => i + 1);

    let h=`<div class="split-grid" style="display:flex; flex-direction:column; gap:15px; padding:8px;">
             <div class="split-item" style="overflow-x:auto;">
               <div class="section-title section-am" style="font-weight:bold; color:#1e40af; margin-bottom:4px;">오전</div>
               <table style="min-width:${30 + amTrips.length*78 + Math.max(0,amTrips.length-1)*26}px">${thead(amTrips)}<tbody>`;
    for(let b=1;b<=busCount;b++) h+=busRows(b, amTrips.map(t=>(t-1)*busCount+b<splitD?gs(b,t):null));
    h+=`</tbody></table></div>
        <div class="split-item" style="overflow-x:auto;">
          <div class="section-title section-pm" style="font-weight:bold; color:#991b1b; margin-bottom:4px;">오후 (${pmTrip}회${pmBus}번~)</div>
          <table style="min-width:${30 + pmTrips.length*78 + Math.max(0,pmTrips.length-1)*26}px">${thead(pmTrips)}<tbody>`;
    for(let p=0;p<busCount;p++){
        const b=((pmBus-1+p)%busCount)+1;
        h+=busRows(b, pmTrips.map(dt=>{const at=b>=pmBus?pmTrip+dt-1:pmTrip+dt; return at<=maxTrip?gs(b,at):null;}));
    }
    el.innerHTML=h+'</tbody></table></div></div>';
}

function renderInput(el){
    const trips = Array.from({length: maxTrip}, (_, i) => i + 1);
    let h=`<div style="padding:8px; overflow-x:auto;"><table class="input-table" style="min-width:${26 + maxTrip*116}px"><thead><tr><th class="fix-col" style="width:24px">번</th>`;
    for(let t of trips) h+=`<th>${t}출발</th><th style="width:36px">운행</th>`;
    h+='</tr></thead><tbody>';
    for(let b=1;b<=busCount;b++){
        h+=`<tr class="bus-start"><td class="seq">${b}</td>`;
        for(let t of trips){
            const dk=`${b}-${t}`, dv=deps[dk]||'', tv=tts[dk]||'';
            h+=`<td><input class="${dv.toUpperCase()==='S'?'s-val':''}" value="${dv}" data-type="dep" data-bus="${b}" data-trip="${t}" onblur="onInput(this)"></td>`;
            h+=`<td><input value="${tv}" data-type="tt" data-bus="${b}" data-trip="${t}" onblur="onInput(this)"></td>`;
        }
        h+='</tr>';
    }
    el.innerHTML=h+'</tbody></table></div>';
}

function onInput(el){
    const b=el.dataset.bus, t=el.dataset.trip, v=el.value.trim();
    if(el.dataset.type==='dep'){ if(!v) delete deps[`${b}-${t}`]; else deps[`${b}-${t}`]=v; }
    else { if(!v) delete tts[`${b}-${t}`]; else tts[`${b}-${t}`]=v; }
    saveData(); schedule=compute();
}

function switchView(v){
    currentView=v; document.querySelectorAll('.tab').forEach((t,i)=>{ if(i<3) t.classList.toggle('active',['integrated','split','input'][i]===v); });
    schedule=compute(); render();
}

const CREW_COLORS = ['#dbeafe', '#dcfce7', '#fef3c7'];   // 파랑 / 초록 / 노랑

            sw.style.background = CREW_COLORS[crews[idx].color];
        };

}
function addCrewRow(){

    renderCrewList();
}
// 특정 (차량, 회차) 가 지정된 조에 속하면 색 반환
function crewColorOf(bus, trip){
    if (!crews.length) return null;
    const splitD = (pmTrip - 1) * busCount + pmBus;
    const d = (trip - 1) * busCount + bus;
    const isPM = d >= splitD;
    for (let i = 0; i < crews.length; i++){
        const cw = crews[i];
        if (Number(cw.bus) !== Number(bus)) continue;
        if (cw.half === 'am' && !isPM) return CREW_COLORS[cw.color];
        if (cw.half === 'pm' &&  isPM) return CREW_COLORS[cw.color];
    }
    return null;
}

function getActualAmPmTrips() {
    let maxInt = 1, maxAm = 1, maxPm = 1;
    const splitD = (pmTrip - 1) * busCount + pmBus;
    const checkKey = (k) => {
        let [b, t] = k.split('-').map(Number);
        maxInt = Math.max(maxInt, t);
        let D = (t - 1) * busCount + b;
        if (D < splitD) { maxAm = Math.max(maxAm, t); } 
        else { let dt = (b >= pmBus) ? (t - pmTrip + 1) : (t - pmTrip); maxPm = Math.max(maxPm, dt); }
    };
    for (let k in deps) { if (deps[k] && String(deps[k]).trim() !== '') checkKey(k); }
    for (let k in tts) { if (tts[k] && String(tts[k]).trim() !== '') checkKey(k); }
    return { maxInt: Math.min(maxTrip, maxInt), maxAm: Math.min(maxTrip, maxAm), maxPm: Math.min(maxTrip, maxPm) };
}

function getScheduleHTML(target) {
    const exportTitle = `${busNum}번 배차 시간표(${displayTitle})`;
    
    let subtitleText = '';
    if (target === 'am') subtitleText = `[ 오 전 ] &nbsp;|&nbsp; 운행대수: ${busCount}대`;
    else if (target === 'pm') subtitleText = `[ 오 후 ] &nbsp;|&nbsp; 운행대수: ${busCount}대`;
    else if (target === 'split') subtitleText = `운행대수: ${busCount}대`; 
    else subtitleText = `운행대수: ${busCount}대`;

    let contentHTML = `<h2 style="text-align:center; margin:0 0 5px 0; padding:0; line-height:1.05; font-size:28px; color:#000; font-weight:900;">${exportTitle}</h2>`;
    contentHTML += `<div style="text-align:center; margin:0 0 6px 0; padding:0; line-height:1.1; font-size:16px; font-weight:bold; color:#333;">${subtitleText}</div>`;

    let hasAnyTT = false;
    for(let key in tts) { if(tts[key] && String(tts[key]).trim() !== '') { hasAnyTT = true; break; } }

    // 4배 확대 시 정수 픽셀이 되도록 0.25 단위로 맞춤 (선 겹침 방지)
    const rawCellHeight = 730 / ( (hasAnyTT ? busCount * 3 : busCount) + 1 );
    const exactCellHeight = Math.round(rawCellHeight * 4) / 4; 
    
    const actualTrips = getActualAmPmTrips();
    let targetMax = actualTrips.maxInt;
    if (target === 'am') targetMax = actualTrips.maxAm;
    else if (target === 'pm') targetMax = actualTrips.maxPm;
    else if (target === 'split') targetMax = Math.max(actualTrips.maxAm, actualTrips.maxPm);

    const fontScale = targetMax > 6 ? Math.max(0.65, 6 / targetMax) : 1;
    
    let fsSeq, fsDep, fsSub;
    if (hasAnyTT) {
        fsSeq = (exactCellHeight * 0.8) * fontScale;  
        fsDep = (exactCellHeight * 0.78) * fontScale;
        fsSub = (exactCellHeight * 0.72) * fontScale; 
    } else {
        fsSeq = Math.min(22, exactCellHeight * 0.7) * fontScale;  
        fsDep = Math.min(20, exactCellHeight * 0.6) * fontScale;  
        fsSub = 14 * fontScale;  
    }

    const tableWidth = (target === 'am' || target === 'pm') ? '60%' : '100%';
    const EXPORT_WITH_REST = getExportRestOption();

    const styleVars = `
        --cell-height: ${exactCellHeight}px;
        --th-height: ${hasAnyTT ? exactCellHeight : Math.min(exactCellHeight, 40)}px;
        --th-fs: ${hasAnyTT ? Math.max(12, exactCellHeight*0.5) : 14}px;
        --fs-seq: ${fsSeq}px;
        --fs-dep: ${fsDep}px;
        --fs-sub: ${fsSub}px;
        --fs-s-big: ${fsDep * 2}px;
        --fs-s-small: ${fsDep * 1.4}px;
    `;

    let exportStyles = `
        .x-wrap { flex: 1; width: 100%; display: flex; flex-direction: column; background: #fff; }
        .x-wrap * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
        .x-container { width:${tableWidth}; height:100%; margin:0 auto; display:flex; flex-direction:row !important; flex-wrap:nowrap !important; align-items:flex-start; justify-content:center; gap:15px; } 
        
        .x-table { border-collapse:collapse; width:100%; height:100%; table-layout:fixed; background:#fff; border-top: 1px solid #9ca3af !important; border-bottom: 1px solid #9ca3af !important;
                   transform: translateZ(0); backface-visibility: hidden; }
        .x-table td, .x-table th { box-sizing: border-box; }
        
        .x-th { background:#e2e8f0 !important; background-clip:padding-box; border:0.25px solid #b4bfcc; border-bottom: 1px solid #9ca3af !important; text-align:center; font-size:var(--th-fs); font-weight:700; height:var(--th-height); color:#0f172a; }
        .x-th-seq { border-right: 1px solid #9ca3af !important; width: 40px; }
        
        .x-td { border:0.25px solid #b4bfcc; text-align:center; vertical-align:middle; height:var(--cell-height); padding:0; line-height:var(--cell-height); overflow:hidden; white-space:nowrap; }
        
        .x-seq { font-weight:900; background:#f8fafc !important; font-size:var(--fs-seq); border-right:1px solid #9ca3af !important; color:#0f172a; }
        .x-dep { font-size:var(--fs-dep); font-weight:600; color:#1d4ed8; }
        .x-arr { font-size:var(--fs-dep); font-weight:600; color:#0f766e; } 
        .x-deps { color:#dc2626; font-weight:900; background-color:#fef2f2 !important; }
        .x-tt, .x-hj { font-size:var(--fs-sub); color:#334155; font-weight:500; } 
        .x-rest { font-size:var(--fs-sub); color:#475569; font-weight:500; background:#fafafa !important; }
        .x-rest-bad { background:#fee2e2 !important; color:#b91c1c; }
        .x-th-rest { width:26px; font-size:calc(var(--th-fs) * 0.8) !important; white-space:nowrap; letter-spacing:-0.5px; padding:0 1px; }
        
        .x-bus-start .x-td { border-top: 1px solid #9ca3af !important; }
        /* 구분선이면서 차량 시작인 셀: 회색 위선 (빨간선보다 먼저 선언) */
        .x-table tr.x-bus-start > td.x-div-left { border-top: 1px solid #9ca3af !important; box-shadow: none !important; }

        /* AM/PM 구분선 — 반드시 마지막에 선언해야 회색선에 덮이지 않음 */
        .x-table td.x-div-left, .x-table th.x-div-left {
            border-left: 2px solid #ef4444 !important;
            position: relative; z-index: 5; box-shadow: none !important;
        }
        .x-table tr.x-bus-start > td.x-div-top,
        .x-table tr.x-bus-start > td.x-div-top.x-div-left {
            border-top: 2px solid #ef4444 !important;
            position: relative; z-index: 6; box-shadow: none !important;
        }
        
        .x-title-box { text-align:center; font-weight:900; margin-bottom:5px; background:#e2e8f0; padding:6px; border:1px solid #9ca3af; border-bottom: none; font-size:15px; border-radius:4px 4px 0 0; color:#1e3a8a; }
        .x-title-box.pm { color:#991b1b; }

        /* 🚨 인쇄 전용 설정 (잘림방지 최적화 1.02배 & 폰트만 1.085배 확대) */
        @media print {
            .x-wrap {
                --cell-height: ${exactCellHeight * 1.02}px !important;
                --th-height: ${(hasAnyTT ? exactCellHeight : Math.min(exactCellHeight, 40)) * 1.02}px !important;
                --fs-seq: ${fsSeq * 1.05}px !important;
                --fs-dep: ${fsDep * 0.92}px !important;
                --fs-sub: ${fsSub * 0.92}px !important;
                --fs-s-big: ${fsDep * 2 * 1.085}px !important;
                --fs-s-small: ${fsDep * 1.4 * 1.085}px !important;
            }

            /* 선 규칙은 전역 @media print 에서 border 로 일괄 처리 (여기서 중복 지정 금지) */

            /* 인쇄 시 글자 가늘게 — 잉크 번짐 방지 */
            .x-dep, .x-arr { font-weight: 500 !important; }
            .x-tt, .x-hj, .x-rest { font-weight: 400 !important; }
            .x-seq { font-weight: 600 !important; }
            .x-th { font-weight: 600 !important; }

            /* 빨간 구분선은 전역 블록에서 처리 */
        }
    `;

    let tableHTML = `<style>${exportStyles}</style><div class="x-wrap" style="${styleVars}"><div class="x-container">`;

    function getExportThead(trips, isIntegrated) {
        const splitD = (pmTrip - 1) * busCount + pmBus;
        let h = `<tr><th class="x-th x-th-seq">순번</th>`;
        trips.forEach((t, i) => {
            // 이 회차의 1번 차량이 PM 이고, 이전 회차 1번 차량이 AM 이면 왼쪽 구분선
            const isPM = ((t - 1) * busCount + 1) >= splitD;
            const prevAM = t > 1 ? (((t - 2) * busCount + 1) < splitD) : false;
            const clsL = (isIntegrated && isPM && prevAM) ? ' x-div-left' : '';
            h += `<th class="x-th${clsL}" colspan="2">${t}회</th>`;
            if (EXPORT_WITH_REST && i < trips.length-1) h += `<th class="x-th x-th-rest">휴식</th>`;
        });
        return `<thead>${h}</tr></thead>`;
    }

    function getExportBusRows(bus, slots, isIntegrated) {
        let r1 = `<td rowspan="${hasAnyTT ? 3 : 1}" class="x-td x-seq">${bus}</td>`, r2 = '', r3 = '';
        const splitD = (pmTrip - 1) * busCount + pmBus;
        
        slots.forEach((s, i) => {
            const t = i + 1;
            const isPM = ((t - 1) * busCount + bus) >= splitD;
            const isPrevTripAM = t > 1 ? (((t - 2) * busCount + bus) < splitD) : false;
            const isPrevBusAM = bus > 1 ? (((t - 1) * busCount + bus - 1) < splitD) : false;
            
            let clsL = (isIntegrated && isPM && isPrevTripAM) ? ' x-div-left' : '';
            let clsT = (isIntegrated && isPM && isPrevBusAM) ? ' x-div-top' : '';

            const isS = s && s.fd === 'S';
            const dep = s ? fmt(s.fd) : '';
            // 실제 회차로 판정 (오전/오후 표는 회차 번호가 재부여되므로 s.trip 우선)
            const realTrip = (s && s.trip) ? s.trip : t;
            const hasData = !!(s && (s.fd != null && s.fd !== ''));
            const cwc = (hasData && typeof crewColorOf === 'function') ? crewColorOf(bus, realTrip) : null;
            const bgS = cwc ? ` background:${cwc} !important;` : '';
            const bgAttr = cwc ? ` style="background:${cwc} !important;"` : '';
            
            if (hasAnyTT) {
                if (isS) {
                    r1 += `<td colspan="2" rowspan="3" class="x-td x-deps${clsL}${clsT}" style="font-size:var(--fs-s-big); border-bottom: 1px solid #cbd5e1;${bgS}">S</td>`;
                } else {
                    r1 += `<td colspan="2" class="x-td x-dep${clsL}${clsT}"${bgAttr}>${dep}</td>`;
                    r2 += `<td class="x-td x-tt${clsL}"${bgAttr}>${s&&s.tt?s.tt:''}</td><td class="x-td x-hj"${bgAttr}>${s&&s.mp!=null?fmt(s.mp):''}</td>`;
                    r3 += `<td colspan="2" class="x-td x-arr${clsL}"${bgAttr}>${s&&s.ar!=null?fmt(s.ar,true):''}</td>`;
                }
            } else { 
                if (isS) {
                    r1 += `<td colspan="2" class="x-td x-deps${clsL}${clsT}" style="font-size:var(--fs-s-small);${bgS}">S</td>`;
                } else {
                    r1 += `<td colspan="2" class="x-td x-dep${clsL}${clsT}"${bgAttr}>${dep}</td>`; 
                }
            }
            // 휴식 열 (AM/PM 구분선이 끊기지 않도록 clsT 승계)
            if (EXPORT_WITH_REST && i < slots.length-1) {
                const ns = slots[i+1];
                const dr = ns && ns.dr != null ? ns.dr : '';
                const bad = (ns && ns.dr != null && ns.dr < 30 && !isS) ? ' x-rest-bad' : '';
                const restBg = (dr !== '' && cwc) ? ` style="background:${cwc} !important;"` : '';
                r1 += `<td rowspan="${hasAnyTT ? 3 : 1}" class="x-td x-rest${bad}${clsT}"${restBg}>${dr}</td>`;
            }
        });
        return hasAnyTT ? `<tr class="x-bus-start">${r1}</tr><tr>${r2}</tr><tr>${r3}</tr>` : `<tr class="x-bus-start">${r1}</tr>`;
    }

    const splitD = (pmTrip - 1) * busCount + pmBus;
    
    const integratedTrips = Array.from({length: actualTrips.maxInt}, (_, i) => i + 1);
    const amTrips = Array.from({length: actualTrips.maxAm}, (_, i) => i + 1);
    const pmTrips = Array.from({length: actualTrips.maxPm}, (_, i) => i + 1);
    
    if (target === 'integrated') {
        tableHTML += `<table class="x-table">${getExportThead(integratedTrips, true)}<tbody>`;
        for(let b=1; b<=busCount; b++) tableHTML += getExportBusRows(b, integratedTrips.map(t=>gs(b,t)), true);
        tableHTML += `</tbody></table>`;
    } else if (target === 'am') {
        tableHTML += `<table class="x-table">${getExportThead(amTrips, false)}<tbody>`;
        for(let b=1; b<=busCount; b++) tableHTML += getExportBusRows(b, amTrips.map(t=>(t-1)*busCount+b<splitD?gs(b,t):null), false);
        tableHTML += `</tbody></table>`;
    } else if (target === 'pm') {
        tableHTML += `<table class="x-table">${getExportThead(pmTrips, false)}<tbody>`;
        for(let p=0; p<busCount; p++){
            const b = ((pmBus-1+p)%busCount)+1;
            tableHTML += getExportBusRows(b, pmTrips.map(dt=>{const at=b>=pmBus?pmTrip+dt-1:pmTrip+dt; return at<=maxTrip?gs(b,at):null;}), false);
        }
        tableHTML += `</tbody></table>`;
    } else if (target === 'split') { 
        tableHTML += `<div style="flex:1; display:flex; flex-direction:column; min-width:0;">
                        <div class="x-title-box">[ 오 전 ]</div>
                        <table class="x-table">${getExportThead(amTrips, false)}<tbody>`;
        for(let b=1; b<=busCount; b++) tableHTML += getExportBusRows(b, amTrips.map(t=>(t-1)*busCount+b<splitD?gs(b,t):null), false);
        tableHTML += `</tbody></table></div>`;
        
        tableHTML += `<div style="flex:1; display:flex; flex-direction:column; min-width:0;">
                        <div class="x-title-box pm">[ 오 후 ]</div>
                        <table class="x-table">${getExportThead(pmTrips, false)}<tbody>`;
        for(let p=0; p<busCount; p++){
            const b = ((pmBus-1+p)%busCount)+1;
            tableHTML += getExportBusRows(b, pmTrips.map(dt=>{const at=b>=pmBus?pmTrip+dt-1:pmTrip+dt; return at<=maxTrip?gs(b,at):null;}), false);
        }
        tableHTML += `</tbody></table></div>`;
    }
    
    return contentHTML + tableHTML + `</div></div>`;
}

function showPCModal(dataUrl, fileName) {
    const modal = document.createElement('div');
    modal.className = "pc-modal-wrap";
    modal.style = "position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:10000; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;";
    modal.innerHTML = `
        <div style="background:#fff; padding:20px; border-radius:12px; width:95%; max-width:800px; max-height:95vh; display:flex; flex-direction:column; align-items:center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <h3 style="margin:0 0 10px 0; color:#1e40af; font-size:18px;">✅ 시간표 생성 완료!</h3>
            <p id="copyMsg" style="margin:0 0 15px 0; font-weight:bold; color:#e53e3e; text-align:center; font-size:14px; background:#fff5f5; padding:10px; border-radius:8px; border:1px solid #fed7d7; width:100%;">
                카카오톡 채팅창에 대고 <b>[ Ctrl + V ] (붙여넣기)</b> 하시면 바로 전송됩니다!
            </p>
            <div style="flex:1; overflow:auto; border:2px dashed #cbd5e0; border-radius:8px; margin-bottom:15px; width:100%; display:flex; justify-content:center; background:#f8fafc; padding:10px;">
                <img src="${dataUrl}" style="max-width:100%; height:auto; display:block; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            </div>
            <div style="display:flex; gap:10px; width:100%;">
                <a href="${dataUrl}" download="${fileName}" style="flex:1; padding:14px; background:#10b981; color:#fff; text-align:center; font-weight:bold; font-size:15px; text-decoration:none; border-radius:8px; transition:0.2s;">📥 내 컴퓨터에 파일로 저장</a>
                <button onclick="this.closest('.pc-modal-wrap').remove()" style="flex:1; padding:14px; background:#4a5568; color:#fff; font-weight:bold; font-size:15px; border:none; border-radius:8px; cursor:pointer; transition:0.2s;">닫기</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}

async function captureAndShare(target) {
    closeShareModal();
    const loading = document.createElement('div');
    loading.innerHTML = '<div style="position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9999; display:flex; align-items:center; justify-content:center; color:white; font-size:18px; font-weight:bold;">이미지 생성 중...</div>';
    document.body.appendChild(loading);

    const actualTrips = getActualAmPmTrips();
    let targetMax = actualTrips.maxInt;
    if (target === 'am') targetMax = actualTrips.maxAm;
    else if (target === 'pm') targetMax = actualTrips.maxPm;
    else if (target === 'split') targetMax = actualTrips.maxAm + actualTrips.maxPm;  // 좌우 나란히

    // 순번 열 + (회차 × 셀폭) + 휴식 열
    const SEQ_W = 50, TRIP_W = 92, REST_W = 30;
    let reqWidth = SEQ_W + targetMax * TRIP_W
                 + (getExportRestOption() ? (targetMax - 1) * REST_W : 0);
    if (target === 'split') reqWidth += SEQ_W;   // 좌우 배치는 순번 열이 두 개
    reqWidth = Math.max(520, reqWidth);

    const exportDiv = document.createElement('div');
    exportDiv.style.width = `${reqWidth}px`; 
    exportDiv.style.padding = '22px 20px 20px 20px';
    exportDiv.style.backgroundColor = '#fff'; 
    exportDiv.style.position = 'absolute'; 
    exportDiv.style.left = '-9999px';
    exportDiv.style.display = 'flex'; 
    exportDiv.style.flexDirection = 'column';
    exportDiv.innerHTML = getScheduleHTML(target);
    document.body.appendChild(exportDiv);

    const canvas = await html2canvas(exportDiv, {
        scale: 4,                    // 초고화질 (기존 2배 → 4배)
        backgroundColor: '#ffffff',
        useCORS: true,
        logging: false,
        imageTimeout: 0,
        letterRendering: true
    });
    const imgData = canvas.toDataURL('image/png');
    const fileName = `${busNum}번_${displayTitle}_${target}.png`;

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    function cleanup() {
        document.body.removeChild(exportDiv);
        document.body.removeChild(loading);
    }

    if (isMobile && navigator.canShare) {
        canvas.toBlob(async (blob) => {
            const file = new File([blob], fileName, { type: 'image/png' });
            try {
                await navigator.share({ files: [file], title: fileName });
            } catch (e) {
                showPCModal(imgData, fileName);
            }
            cleanup();
        });
    } else {
        showPCModal(imgData, fileName);
        canvas.toBlob(async (blob) => {
            try {
                const item = new ClipboardItem({ 'image/png': blob });
                await navigator.clipboard.write([item]);
            } catch(e) {
                document.getElementById('copyMsg').innerHTML = '아래 사진에 <b>마우스 우클릭 -> [이미지 복사]</b> 후 카톡에 붙여넣기 하세요.';
            }
            cleanup();
        });
    }
}

function triggerPrint() {
    // 휴식시간 포함 여부 선택 (전송 설정과 공유)
    var withRest = confirm('휴식시간을 포함해서 인쇄할까요?\n\n[확인] 포함    [취소] 미포함');
    try { localStorage.setItem('exportWithRest', withRest ? '1' : '0'); } catch(e){}
    restoreExportRestOption();
    updatePrintContainer(); 
    setTimeout(() => { window.print(); }, 500); 
}

document.addEventListener('keydown', function(e) {
    if (currentView !== 'input') return;
    const target = e.target;
    if (target.tagName !== 'INPUT' || !target.closest('.input-table')) return;

    const td = target.closest('td');
    const tr = target.closest('tr');
    if (!td || !tr) return;

    const cellIndex = Array.from(tr.children).indexOf(td);
    let nextInput = null;

    if (e.key === 'ArrowUp') {
        e.preventDefault(); 
        const prevTr = tr.previousElementSibling;
        if (prevTr) nextInput = prevTr.children[cellIndex]?.querySelector('input');
    } else if (e.key === 'ArrowDown' || e.key === 'Enter') {
        e.preventDefault();
        const nextTr = tr.nextElementSibling;
        if (nextTr) nextInput = nextTr.children[cellIndex]?.querySelector('input');
    } else if (e.key === 'ArrowLeft') {
        if (target.selectionStart === 0 && target.selectionEnd === 0) {
            e.preventDefault();
            let prevTd = td.previousElementSibling;
            while (prevTd && !prevTd.querySelector('input')) prevTd = prevTd.previousElementSibling;
            if (prevTd) nextInput = prevTd.querySelector('input');
        }
    } else if (e.key === 'ArrowRight') {
        if (target.selectionStart === target.value.length && target.selectionEnd === target.value.length) {
            e.preventDefault();
            let nextTd = td.nextElementSibling;
            while (nextTd && !nextTd.querySelector('input')) nextTd = nextTd.nextElementSibling;
            if (nextTd) nextInput = nextTd.querySelector('input');
        }
    }

    if (nextInput) {
        nextInput.focus();
        nextInput.select(); 
    }
});
